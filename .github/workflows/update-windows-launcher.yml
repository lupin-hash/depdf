name: Update Windows Launcher

on:
  push:
    branches: [main]
    paths:
      - 'DePDF-Windows.bat'
      - '.github/workflows/update-windows-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-launcher-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Verify launcher file
        run: test -s DePDF-Windows.bat

      - name: Update the existing Windows launcher release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload windows-v1.0 DePDF-Windows.bat --clobber
