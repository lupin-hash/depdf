name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']        # pushing a tag like v1.1 builds AND publishes a release
  pull_request:
  workflow_dispatch:    # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write       # needed to create a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional: sign with your own key so updates install over the old version.
      # Add the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see GITHUB_GUIDE.md).
      - name: Prepare signing key (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS="-PappVersion=${GITHUB_REF_NAME#v} -PappVersionCode=${GITHUB_RUN_NUMBER}"
          fi
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease $ARGS --console=plain
            SRC=app/build/outputs/apk/release/app-release.apk
          else
            echo "No signing key set: building a debug-signed APK."
            ./gradlew assembleDebug $ARGS --console=plain
            SRC=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p dist
          cp "$SRC" dist/DePDF.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFCleaner-apk
          path: dist/DePDF.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/DePDF.apk "dist/DePDF-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "dist/DePDF-${GITHUB_REF_NAME}.apk" \
            --title "DePDF ${GITHUB_REF_NAME}" --generate-notes
