name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
          - { language: java-kotlin, build-mode: manual }
    steps:
      - uses: actions/checkout@v4

      # Java/Kotlin only: the Android project needs files that `npm run sync:android`
      # generates (capacitor.settings.gradle, app/capacitor.build.gradle). Default setup
      # cannot create them, which is why its autobuild fails.
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.language == 'java-kotlin'
        name: Install and sync Capacitor
        run: |
          npm ci
          npm run sync:android

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'java-kotlin'
        name: Build the app so CodeQL can trace it
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
